<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸墨 1.1 · 阅读预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dcded8;font-family:system-ui,'Microsoft YaHei',sans-serif;color:#26332b}header{max-width:1400px;padding:32px 32px 20px;margin:auto}header h1{font-size:26px;margin:0 0 8px}header p{font-size:14px;margin:0;color:#505e54}.compare{max-width:1400px;margin:auto;padding:0 28px 32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.pane{background:var(--color-background);color:var(--color-text);border:1px solid var(--color-border);border-radius:16px;overflow:hidden;font:var(--font-size)/var(--lineHeight-body) var(--font-body)}.bar{padding:15px 25px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;background:var(--color-surface)}.mode{font-size:12px;letter-spacing:.1em;font-weight:600;color:var(--color-textMuted)}.tag{font-size:12px;border:1px solid var(--color-border);padding:3px 9px;border-radius:20px;color:var(--color-accent)}article{max-width:var(--editor-contentWidth);padding:30px;margin:auto}h2{font-size:30px;line-height:1.35;letter-spacing:-.03em;margin:0 0 10px}h3{font-size:19px;margin:28px 0 8px}.meta{color:var(--color-textMuted);font-size:13px;margin:0 0 24px}p{margin:14px 0}a{color:var(--color-accent);text-underline-offset:3px}blockquote{background:var(--color-surfaceMuted);border-left:3px solid var(--color-accent);border-radius:0 8px 8px 0;margin:22px 0;padding:14px 18px}blockquote p{margin:0}.muted{color:var(--color-textMuted);font-size:14px}code,pre{font-family:var(--font-mono);font-size:13px}pre{background:var(--color-surfaceMuted);border:1px solid var(--color-border);border-radius:8px;padding:16px;overflow:auto;line-height:1.7}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:25px}.button{display:inline-block;background:var(--color-accent);color:var(--color-accentForeground);padding:7px 16px;border-radius:8px;font-size:14px}.palette{display:flex;gap:6px}.palette i{display:block;width:20px;height:20px;border-radius:50%;border:1px solid var(--color-border)}@media(max-width:800px){.compare{grid-template-columns:1fr;padding:0 12px 20px;gap:14px}header{padding:22px 16px}article{padding:23px}h2{font-size:26px}}
</style></head><body><header><h1>纸墨 · 让阅读慢下来</h1><p>16 px 字号 · 1.75 行距 · 800 px 正文宽度上限 · 明暗双配色</p></header><main class="compare"></main>
<template id="sample"><div class="bar"><span class="mode"></span><span class="tag">阅读笔记</span></div><article><h2>留一点空白，<br>给今天的想法。</h2><p class="meta">2026 年 11 月 12 日 · 约 3 分钟阅读</p><p>一篇好的笔记，可以从一个很小的观察开始。窗边的光、读到的一句话，或是午后终于想通的问题，都值得认真记下。</p><p>暖纸色保留柔和的阅读氛围，清楚的正文与辅助文字，让日期、注释和链接也容易辨认。<a href="#reading">继续阅读相关笔记</a>。</p><blockquote><p>记下正在发生的事，也为尚未成形的想法留出位置。</p><p class="muted">摘录 · 日常观察</p></blockquote><h3>本周想继续的三件事</h3><ul><li>整理收藏的文章，写下自己的理解。</li><li>每天留出十分钟，回看当天的心情。</li><li>完成一个小改进，再开始下一个。</li></ul><h3>文字与代码各有位置</h3><pre><code>const note = {
  title: "今天的小发现",
  tags: ["阅读", "生活"]
};</code></pre><p class="muted">辅助文字 · 日期 · 注释<br>明暗模式都保留足够的文字层次。</p><div class="bottom"><span class="button">继续书写</span><span class="palette"></span></div></article></template>
<script>const manifest={"type": "theme", "id": "com.example.paper-ink-theme", "name": "Paper Ink", "version": "1.1.0", "themeApiVersion": "1", "description": "Warm paper and deep green colors with readable typography and improved text contrast.", "locales": {"zh-CN": {"name": "纸墨", "description": "暖纸与墨绿双配色，优化长文阅读的字号、行距与文字对比度。"}}, "author": "ZhenYu-Jiang", "modes": ["light", "dark"], "light": {"color.background": "#f6f2e9", "color.surface": "#fdfaf3", "color.surfaceMuted": "#eee8da", "color.text": "#33302a", "color.textMuted": "#6b6356", "color.border": "#e0d8c7", "color.accent": "#356b50", "color.accentForeground": "#ffffff", "font.body": "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif", "font.mono": "ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace", "radius.medium": "0.5rem", "editor.contentWidth": "800px", "font.size": "16px", "lineHeight.body": "1.75", "density.scale": "1"}, "dark": {"color.background": "#1c201e", "color.surface": "#232825", "color.surfaceMuted": "#2b312d", "color.text": "#e6e3d9", "color.textMuted": "#9aa49a", "color.border": "#3a423c", "color.accent": "#6fbe94", "color.accentForeground": "#142019", "font.body": "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif", "font.mono": "ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace", "radius.medium": "0.5rem", "editor.contentWidth": "800px", "font.size": "16px", "lineHeight.body": "1.75", "density.scale": "1"}};for(const mode of ['light','dark']){const pane=document.createElement('section');pane.className='pane';pane.dataset.mode=mode;for(const [key,value]of Object.entries(manifest[mode]))pane.style.setProperty('--'+key.replaceAll('.','-'),value);pane.append(document.getElementById('sample').content.cloneNode(true));pane.querySelector('.mode').textContent=mode==='light'?'暖纸 · LIGHT':'墨绿 · DARK';for(const key of ['color.background','color.surface','color.surfaceMuted','color.text','color.accent']){const swatch=document.createElement('i');swatch.style.background=manifest[mode][key];pane.querySelector('.palette').append(swatch)}document.querySelector('.compare').append(pane)}</script></body></html>
